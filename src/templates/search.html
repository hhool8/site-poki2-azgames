<section>
  <div class="container">
    <h1 class="section-title">Search {{GAME_COUNT}} Games</h1>
    <p class="section-sub">Type a name, a category or a genre — results filter as you type.</p>
    <form class="search-big" action="/search/" method="get" role="search">
      <input class="search-big__input" type="search" name="q" id="q" value="{{QUERY}}" placeholder="Search {{GAME_COUNT}} games..." aria-label="Search games" autocomplete="off" autofocus>
    </form>
    <p class="search-hint" data-hint>{{HINT}}</p>
    <div class="featured-grid" data-results>{{RESULTS}}</div>
  </div>
</section>
