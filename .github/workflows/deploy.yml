name: Deploy azgames.poki2.online

# Build the static site from committed data (data/catalog.json + data/img/)
# and deploy dist/ to the Cloudflare Pages project. The project is
# direct-upload (wrangler.toml), so CI deploys through the API rather than
# the Pages Git integration.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: python3 tools/build_site.py

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name azgames-poki2-site --branch main --commit-dirty=true
